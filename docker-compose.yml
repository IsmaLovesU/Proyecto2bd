# docker-compose.yml — Proyecto 3

services:

  db:
    image: postgres:16
    container_name: ecommerce_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - ./db/procedures.sql:/docker-entrypoint-initdb.d/03_procedures.sql
      - ./db/roles.sql:/docker-entrypoint-initdb.d/04_roles.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout:  5s
      retries:  5

  backend:
    build: ./backend
    container_name: ecommerce_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST:        db
      DB_PORT:        ${DB_PORT}
      DB_USER:        ${DB_USER}
      DB_PASSWORD:    ${DB_PASSWORD}
      DB_NAME:        ${DB_NAME}
      SESSION_SECRET: ${SESSION_SECRET}
      PORT:           ${PORT}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: